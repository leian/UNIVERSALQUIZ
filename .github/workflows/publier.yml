# Publie une nouvelle version du moteur pour l'installateur en ligne.
# Déclenchement : pousser un tag qui commence par v (ex. v2.1),
# ou Actions → « Publier l'installateur » → Run workflow.
# 1. teste le projet (faux Google + Chrome) ;
# 2. fabrique universal-quiz.json (le moteur au format de l'API Apps Script) ;
# 3. crée la Release qui le contient, marquée « dernière version » :
#    l'installateur en ligne (en-ligne/Code.gs) la lit toute seule.
name: Publier l'installateur

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la version à publier (ex. v2.1)'
        required: true

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester le projet (faux Google + Chrome)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/test.mjs
      - name: Fabriquer le moteur pour l'installateur en ligne (universal-quiz.json)
        run: node outils/fabriquer-charge.mjs
      - name: Créer ou mettre à jour la Release
        run: |
          cat > notes.md <<NOTES
          **Installation et mise à jour** : ouvrez le lien de l'installateur en ligne reçu par mail, depuis un téléphone ou un ordinateur. Il installe toujours la dernière version, et le bouton « Mettre à jour mon site » applique les nouvelles versions sans changer l'adresse du site.

          Le fichier \`universal-quiz.json\` ci-dessous est lu automatiquement par l'installateur : vous n'avez rien à télécharger.

          Licence PolyForm Noncommercial 1.0.0 : usage commercial interdit.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/universal-quiz.json --clobber
            gh release edit "$TAG" --latest --prerelease=false --draft=false
          else
            gh release create "$TAG" dist/universal-quiz.json \
              --title "Universal Quiz $TAG" --notes-file notes.md --latest
          fi
