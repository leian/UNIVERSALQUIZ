<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoccaQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap">
<style>
:root{
  --bg:#fff8ef; --card:#ffffff; --ink:#2a1f1a; --soft:#7a6658; --line:#eadfce;
  --fr:#2563eb; --math:#ea580c; --sci:#0891b2; --en:#b91c1c; --hist:#a16207; --geo:#15803d; --mus:#db2777; --autre:#475569;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1a1412; --card:#241c18; --ink:#f8efe6; --soft:#c4b3a3; --line:#3a2e27;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto;padding:32px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:1000px){.wrap{grid-template-columns:minmax(0,1fr) 300px}#cote{position:sticky;top:16px;align-self:start}}
#recompenses .badges-panel{background:var(--card);border:2px solid var(--line);color:var(--ink)}
#recompenses .bp-count,#recompenses .bp-vide{color:var(--soft)}
/* icônes : un seul jeu, traits fins (style Lucide) */
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.tuile{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);flex:none}
.tuile .ic{width:22px;height:22px}
/* en-tête : marque à gauche, contrôles papier à droite ; salut avec la mascotte */
header{margin-bottom:14px}
.barre{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.5rem,5vw,2.1rem);margin:0}
.salut{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:var(--soft);font-size:1.05rem}
.salut .mascotte{width:72px;height:72px}
.salut b{display:block;color:var(--ink);font:600 1.25rem "Fredoka",sans-serif}
/* outils : recherche + matières sur une seule ligne qui défile */
.outils{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0 8px;margin:4px 0 6px}
.search-box{position:relative}
.search-box .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soft)}
.search{display:block;width:100%;padding:12px 16px 12px 42px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit}
.search:focus{outline:3px solid #e8a83a;outline-offset:1px}
.filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 .95rem "Fredoka",sans-serif;cursor:pointer}
.filters button .ic{color:var(--c,currentColor)}
.filters button.on{background:#c8102e;color:#fff;border-color:#c8102e}
.filters button.on .ic{color:#fff}
section{margin-top:26px}
h2{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.3rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.btn-icone{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 .9rem "Fredoka",sans-serif;text-decoration:none}
.btn-icone:hover{border-color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);
  border-left:8px solid var(--c);border-radius:16px;padding:16px;transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08);outline:none}
.card .tete{display:flex;align-items:center;gap:10px}
.card .t{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.1rem;line-height:1.25}
.card .d{color:var(--soft);font-size:.9rem;margin-top:8px}
.card{position:relative}
.card .score{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:600 .82rem "Fredoka",sans-serif;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.card .new{position:absolute;top:10px;right:10px;background:#16a34a;color:#fff;font:700 .7rem "Fredoka",sans-serif;border-radius:999px;padding:2px 8px}
.marque{display:flex;align-items:center;gap:10px}
.marque img{border-radius:14px}
.marque em{font-style:normal;color:#b3001b}
@media (prefers-color-scheme: dark){.marque em{color:#ff5c72}}
/* « Ma semaine » : progression de la semaine, comparée à la précédente */
.semaine{margin:0 0 16px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left}
.semaine h3{margin:0 0 8px;font:600 1.05rem "Fredoka",sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px}
.semaine h3 .ic{color:#c8102e;margin-right:6px}
.semaine h3 small{font:500 .8rem "Nunito",sans-serif;color:var(--soft)}
.sem-jours{display:flex;justify-content:space-between;gap:4px;margin-bottom:10px}
.sem-jour{flex:1;text-align:center;font:600 .75rem "Fredoka",sans-serif;color:var(--soft)}
.sem-jour i{display:block;margin:3px auto 0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);line-height:22px;font-style:normal;font-size:.8rem}
.sem-jour.fait i{background:#22c55e;border-color:#22c55e;color:#fff}
.sem-jour.auj i{border-color:var(--ink)}
.sem-chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sem-chiffre{background:var(--bg);border-radius:12px;padding:6px 4px;text-align:center}
.sem-chiffre b{display:block;font:700 1.25rem "Fredoka",sans-serif}
.sem-chiffre span{font-size:.75rem;color:var(--soft)}
.sem-chiffre em{display:block;font-style:normal;font-size:.72rem;font-weight:700}
.sem-chiffre em.plus{color:#16a34a}.sem-chiffre em.moins{color:#dc2626}.sem-chiffre em.egal{color:var(--soft)}
.sem-barres,.sem-noms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;justify-items:center}
.sem-barres{align-items:end;height:44px;margin-top:12px}
.sem-barres div{width:100%;max-width:30px;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--line)}
.sem-barres div.cette{background:#c8102e}
.sem-noms{margin-top:3px;font-size:.66rem;color:var(--soft);white-space:nowrap}
.sem-msg{margin:8px 0 0;font-size:.85rem;color:var(--soft);text-align:center}
.serie{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#fdeceb;color:#9e0b24;border-radius:999px;padding:2px 12px;font:600 .9rem "Fredoka",sans-serif}
@media (prefers-color-scheme: dark){.serie{background:#3a1f22;color:#ff8a96}}

.espace-parent{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;padding:4px 14px;border-radius:999px;background:#fdeceb;color:#9e0b24;font-size:.85rem;font-weight:600}
.foot{text-align:center;margin-top:40px;font-size:.85rem}
.foot a{color:var(--soft);display:inline-flex;align-items:center;gap:5px}
.empty .mascotte{display:block;margin:0 auto 8px;width:96px;height:96px}
.empty{text-align:center;color:var(--soft);background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:32px 16px;margin-top:32px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
 <div class="col">
  <header>
    <div class="barre">
      <h1 class="marque"><img src="https://leian.github.io/UNIVERSALQUIZ/icone-96.png" width="44" height="44" alt=""><span>Socca<em>Quiz</em></span></h1>
      <a class="btn-icone" href="controles.html"><i data-ic="printer"></i> Contrôles</a>
    </div>
    <div class="salut"><span class="mascotte m-accueil" aria-hidden="true"></span><div><b>Salut {{PRENOM}} !</b>Choisis un quiz et lance-toi.<div id="serie"></div></div></div>
    <p class="espace-parent" id="espace-parent" hidden><i data-ic="lock"></i> Espace parent · ton enfant utilise son propre lien, sans les pages parents</p>
  </header>
  <div class="outils">
    <div class="search-box"><i data-ic="search"></i><input class="search" id="q" type="search" placeholder="Chercher un quiz…" aria-label="Chercher un quiz"></div>
    <div class="filters" id="filters"></div>
  </div>
  <main id="list"></main>
  <p class="foot" id="foot"><a href="ajouter.html"><i data-ic="plus"></i> Ajouter un quiz</a> · <a href="tableau-de-bord.html"><i data-ic="chart"></i> Suivi des résultats (parents)</a></p>
 </div>
 <aside id="cote"><div id="semaine"></div><div id="recompenses"></div></aside>
</div>

<script src="commun/catalogue.js"></script>
<script src="commun/badges.js"></script>
<script>
/* La liste des quiz est dans commun/catalogue.js */
/* jeu d'icônes cohérent (traits fins, style Lucide, licence ISC) : matières et boutons */
const ICONES = {
  francais: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  maths: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/>',
  sciences: '<path d="M9 2v6L4 18a2 2 0 0 0 1.8 3h12.4a2 2 0 0 0 1.8-3L15 8V2"/><path d="M8 2h8M7 15h10"/>',
  anglais: '<path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/>',
  histoire: '<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l9 5H3z"/>',
  geographie: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  musique: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  autre: '<path d="M8.3 10a.7.7 0 0 1-.6-1L11.4 3a.7.7 0 0 1 1.2 0L16.3 9a.7.7 0 0 1-.6 1z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/>',
  tout: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chart: '<path d="M3 3v18h18"/><path d="M8 17v-4M13 17V8M18 17v-7"/>',
  tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9Z"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3.3.3 1.6 1.4 2.8 2.5 2.8Z"/>',
  star: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>'
};
const I = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONES[n] || ICONES.autre}</svg>`;
document.querySelectorAll("i[data-ic]").forEach(e => { e.outerHTML = I(e.dataset.ic); });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
let filtre = "tout";

function afficherFiltres(){
  const presentes = [...new Set(QUIZ.map(q => q.matiere in MATIERES ? q.matiere : "autre"))];
  const el = document.getElementById("filters");
  if (presentes.length < 2) { el.innerHTML = ""; return; }
  el.innerHTML = ["tout", ...Object.keys(MATIERES).filter(m => presentes.includes(m))]
    .map(m => `<button data-m="${m}" class="${m === filtre ? "on" : ""}" style="--c:${m === "tout" ? "currentColor" : MATIERES[m].c}">${I(m === "tout" ? "tout" : m)} ${m === "tout" ? "Tout" : MATIERES[m].nom}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { filtre = b.dataset.m; afficherFiltres(); afficherListe(); });
}

function afficherListe(){
  const texte = document.getElementById("q").value.trim().toLowerCase();
  const list = document.getElementById("list");
  if (!QUIZ.length) {
    list.innerHTML = `<div class="empty"><span class="mascotte m-reflexion" aria-hidden="true"></span>Aucun quiz pour l'instant… Les premiers arrivent bientôt !</div>`;
    return;
  }
  const visibles = QUIZ.filter(q => {
    const m = q.matiere in MATIERES ? q.matiere : "autre";
    return (filtre === "tout" || filtre === m) &&
           (!texte || (q.titre + " " + (q.description || "")).toLowerCase().includes(texte));
  });
  if (!visibles.length) { list.innerHTML = `<div class="empty"><span class="mascotte m-reflexion" aria-hidden="true"></span>Aucun quiz ne correspond à ta recherche.</div>`; return; }
  list.innerHTML = Object.keys(MATIERES).map(m => {
    const qs = visibles.filter(q => (q.matiere in MATIERES ? q.matiere : "autre") === m)
                       .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    if (!qs.length) return "";
    const M = MATIERES[m];
    return `<section><h2 style="--c:${M.c}"><span class="tuile">${I(m)}</span>${M.nom}</h2><div class="grid">` +
      qs.map(q => `<a class="card" style="--c:${M.c}" href="${encodeURI(q.fichier)}">
        <div class="tete"><span class="tuile">${I(m)}</span><div class="t">${esc(q.titre)}</div></div>
        <div class="d">${esc(q.description)}</div>${badge(q)}</a>`).join("") + `</div></section>`;
  }).join("");
}

/* ---------- scores (suivi des résultats) ---------- */
let STATS = {};
const cle = f => String(f).split("/").pop().replace(/\.html$/i, "");
function badge(q) {
  const s = STATS[cle(q.fichier)];
  if (!s) {
    const recent = q.date && (Date.now() - new Date(q.date)) < 7 * 864e5;
    return recent && /\.html$/i.test(q.fichier) ? `<span class="new">Nouveau !</span>` : "";
  }
  const nb = s.best >= 90 ? 3 : s.best >= 70 ? 2 : s.best >= 50 ? 1 : 0;
  const etoiles = [0, 1, 2].map(i => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px;${i < nb ? "fill:#e8a83a;stroke:#e8a83a" : "opacity:.35"}">${ICONES.star}</svg>`).join("");
  return `<span class="score" title="Meilleur score">${etoiles} ${s.best} % · ${s.n} partie${s.n > 1 ? "s" : ""}</span>`;
}
function calculerStats(liste) {
  STATS = {};
  const jours = new Set();
  liste.forEach(r => {
    if (!r.total) return;
    const k = cle(r.quiz), p = Math.round(r.score / r.total * 100);
    const s = STATS[k] = STATS[k] || { best: 0, n: 0 };
    s.best = Math.max(s.best, p); s.n++;
    if (r.date) jours.add(new Date(r.date).toLocaleDateString("fr-CA"));
  });
  // série de jours d'affilée (aujourd'hui ou hier compris)
  let serie = 0; const d = new Date();
  if (!jours.has(d.toLocaleDateString("fr-CA"))) d.setDate(d.getDate() - 1);
  while (jours.has(d.toLocaleDateString("fr-CA"))) { serie++; d.setDate(d.getDate() - 1); }
  document.getElementById("serie").innerHTML = serie >= 2 ? `<span class="serie">${I("flame")} ${serie} jours d'affilée !</span>` : "";
  afficherSemaine(liste);
}
/* ---------- « Ma semaine » : la semaine en cours (lundi → dimanche) comparée à la précédente ---------- */
function lundi(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function afficherSemaine(liste) {
  const el = document.getElementById("semaine");
  const parties = liste.filter(r => r.total && r.date && !isNaN(new Date(r.date)));
  if (!parties.length) { el.innerHTML = ""; return; }
  const debut = lundi(new Date()), SEM = 7 * 864e5;
  const num = d => Math.floor((lundi(d) - debut) / SEM + 0.5);     // 0 = cette semaine, -1 = la précédente…
  const sem = n => {
    const ps = parties.filter(r => num(new Date(r.date)) === n);
    const bonnes = ps.reduce((t, r) => t + r.score, 0), total = ps.reduce((t, r) => t + r.total, 0);
    return { quiz: ps.length, bonnes, moyenne: total ? Math.round(bonnes / total * 100) : null,
             jours: new Set(ps.map(r => (new Date(r.date).getDay() + 6) % 7)) };
  };
  const cette = sem(0), avant = sem(-1);
  const ecart = (a, b, unite = "") => {
    if (b === null || b === undefined || a === null) return "";
    const d = a - b;
    return d > 0 ? `<em class="plus">▲ +${d}${unite}</em>` : d < 0 ? `<em class="moins">▼ ${d}${unite}</em>` : `<em class="egal">= pareil</em>`;
  };
  const auj = (new Date().getDay() + 6) % 7;
  const jours = ["L", "M", "M", "J", "V", "S", "D"].map((l, i) =>
    `<div class="sem-jour${cette.jours.has(i) ? " fait" : ""}${i === auj ? " auj" : ""}">${l}<i>${cette.jours.has(i) ? "✓" : ""}</i></div>`).join("");
  const six = [-5, -4, -3, -2, -1, 0].map(n => ({ n, b: sem(n).bonnes }));
  const max = Math.max(1, ...six.map(x => x.b));
  const barres = six.map(x => `<div${x.n === 0 ? ' class="cette"' : ""} title="${x.b} bonne${x.b > 1 ? "s" : ""} réponse${x.b > 1 ? "s" : ""}" style="height:${Math.round(x.b / max * 44)}px"></div>`).join("");
  const noms = six.map(x => `<span>${x.n === 0 ? "cette sem." : x.n === -1 ? "sem. passée" : ""}</span>`).join("");
  const msg = !cette.quiz ? "Lance un quiz pour commencer ta semaine ! 🚀"
    : cette.bonnes > avant.bonnes ? "Tu as déjà fait mieux que la semaine dernière, bravo ! 🎉"
    : avant.bonnes ? `Encore ${avant.bonnes - cette.bonnes + 1} bonne${avant.bonnes - cette.bonnes + 1 > 1 ? "s" : ""} réponse${avant.bonnes - cette.bonnes + 1 > 1 ? "s" : ""} pour battre la semaine dernière ! 💪`
    : "Belle semaine, continue comme ça ! 🌟";
  el.innerHTML = `<section class="semaine" aria-label="Ma semaine">
    <h3><span>${I("calendar")}Ma semaine</span> <small>${cette.jours.size} jour${cette.jours.size > 1 ? "s" : ""} sur 7</small></h3>
    <div class="sem-jours">${jours}</div>
    <div class="sem-chiffres">
      <div class="sem-chiffre"><b>${cette.quiz}</b><span>quiz joué${cette.quiz > 1 ? "s" : ""}</span>${avant.quiz ? ecart(cette.quiz, avant.quiz) : ""}</div>
      <div class="sem-chiffre"><b>${cette.bonnes}</b><span>bonne${cette.bonnes > 1 ? "s" : ""} réponse${cette.bonnes > 1 ? "s" : ""}</span>${avant.quiz ? ecart(cette.bonnes, avant.bonnes) : ""}</div>
      <div class="sem-chiffre"><b>${cette.moyenne === null ? "–" : cette.moyenne + " %"}</b><span>de réussite</span>${ecart(cette.moyenne, avant.moyenne, " pts")}</div>
    </div>
    <div class="sem-barres" aria-hidden="true">${barres}</div><div class="sem-noms" aria-hidden="true">${noms}</div>
    <p class="sem-msg">${msg}</p></section>`;
}
async function chargerScores() {
  let liste = null;
  try {
    const r = await fetch("/api/resultats", { cache: "no-store", credentials: "same-origin" });
    if (r.ok) liste = (await r.json()).resultats;
  } catch (e) {}
  if (!liste) { try { liste = JSON.parse(localStorage.getItem("uqSuivi.local")) || []; } catch (e) { liste = []; } }
  calculerStats(liste);
  afficherListe();
}

document.getElementById("q").addEventListener("input", afficherListe);
afficherFiltres();
afficherListe();
chargerScores();
Badges.monter();
/* ---------- site de l'enfant / espace parent ---------- */
(function () {
  var U = window.__UQ || {}, f = document.getElementById("foot");
  var lien = (href, txt) => `<a href="${esc(href)}" target="_top">${txt}</a>`;
  if (U.espace === "enfant") {            // l'enfant ne voit pas les pages des parents, seulement la porte de l'espace parent
    f.innerHTML = U.urlParent ? lien(U.urlParent, I("lock") + " Espace parent") : "";
    return;
  }
  if (U.espace === "parent") document.getElementById("espace-parent").hidden = false;
  if (U.installateur) f.innerHTML += " · " + lien(U.installateur, I("tool") + " Installateur (mise à jour, lien pour l'enfant)");
})();

</script>
