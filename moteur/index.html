<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoccaQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap">
<style>
:root{
  --bg:#fff8ef; --card:#ffffff; --ink:#2a1f1a; --soft:#7a6658; --line:#eadfce;
  --fr:#2563eb; --math:#ea580c; --sci:#0891b2; --en:#b91c1c; --hist:#a16207; --geo:#15803d; --mus:#db2777; --autre:#475569;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1a1412; --card:#241c18; --ink:#f8efe6; --soft:#c4b3a3; --line:#3a2e27;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto;padding:32px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:1100px){.wrap{grid-template-columns:minmax(0,1fr) 230px}#recompenses{position:sticky;top:16px;align-self:start}}
#recompenses .badges-panel{background:var(--card);border:2px solid var(--line);color:var(--ink)}
#recompenses .bp-count,#recompenses .bp-vide{color:var(--soft)}
header{text-align:center;margin-bottom:28px}
h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(2rem,6vw,3rem);margin:0}
header p{color:var(--soft);margin:6px 0 0}
header .salut{display:flex;align-items:center;justify-content:center;gap:8px}
.search{display:block;width:100%;max-width:420px;margin:20px auto 0;padding:12px 16px;border:2px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--ink);font:inherit}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.filters button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:6px 14px;font:600 .95rem "Fredoka",sans-serif;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-top:32px}
h2{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.4rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2 .dot{width:14px;height:14px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);
  border-left:8px solid var(--c);border-radius:16px;padding:16px;transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08);outline:none}
.card .emo{font-size:1.8rem}
.card .t{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.1rem;margin:4px 0 2px}
.card .d{color:var(--soft);font-size:.9rem}
.card{position:relative}
.card .score{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:600 .82rem "Fredoka",sans-serif;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.card .new{position:absolute;top:10px;right:10px;background:#16a34a;color:#fff;font:700 .7rem "Fredoka",sans-serif;border-radius:999px;padding:2px 8px}
.marque{display:flex;align-items:center;justify-content:center;gap:12px}
.marque img{border-radius:14px}
.marque em{font-style:normal;color:#b3001b}
@media (prefers-color-scheme: dark){.marque em{color:#ff5c72}}
/* « Ma semaine » : progression de la semaine, comparée à la précédente */
.semaine{max-width:460px;margin:16px auto 0;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left}
.semaine h3{margin:0 0 8px;font:600 1.05rem "Fredoka",sans-serif;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.semaine h3 small{font:500 .8rem "Nunito",sans-serif;color:var(--soft)}
.sem-jours{display:flex;justify-content:space-between;gap:4px;margin-bottom:10px}
.sem-jour{flex:1;text-align:center;font:600 .75rem "Fredoka",sans-serif;color:var(--soft)}
.sem-jour i{display:block;margin:3px auto 0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);line-height:22px;font-style:normal;font-size:.8rem}
.sem-jour.fait i{background:#22c55e;border-color:#22c55e;color:#fff}
.sem-jour.auj i{border-color:var(--ink)}
.sem-chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sem-chiffre{background:var(--bg);border-radius:12px;padding:6px 4px;text-align:center}
.sem-chiffre b{display:block;font:700 1.25rem "Fredoka",sans-serif}
.sem-chiffre span{font-size:.75rem;color:var(--soft)}
.sem-chiffre em{display:block;font-style:normal;font-size:.72rem;font-weight:700}
.sem-chiffre em.plus{color:#16a34a}.sem-chiffre em.moins{color:#dc2626}.sem-chiffre em.egal{color:var(--soft)}
.sem-barres,.sem-noms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;justify-items:center}
.sem-barres{align-items:end;height:44px;margin-top:12px}
.sem-barres div{width:100%;max-width:30px;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--line)}
.sem-barres div.cette{background:#c8102e}
.sem-noms{margin-top:3px;font-size:.66rem;color:var(--soft);white-space:nowrap}
.sem-msg{margin:8px 0 0;font-size:.85rem;color:var(--soft);text-align:center}
.serie{display:inline-block;margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font:600 .95rem "Fredoka",sans-serif}
.ctrl-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;font:600 .95rem "Fredoka",sans-serif;text-decoration:none}
.ctrl-link:hover{border-color:var(--soft)}
.espace-parent{display:inline-block;margin:10px auto 0;padding:4px 14px;border-radius:999px;background:#fdeceb;color:#9e0b24;font-size:.85rem;font-weight:600}
.foot{text-align:center;margin-top:40px;font-size:.85rem}
.foot a{color:var(--soft)}
.empty{text-align:center;color:var(--soft);background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:32px 16px;margin-top:32px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
 <div class="col">
  <header>
    <h1 class="marque"><img src="https://leian.github.io/UNIVERSALQUIZ/icone-96.png" width="60" height="60" alt=""><span>Socca<em>Quiz</em></span></h1>
    <p class="salut"><span class="mascotte m-accueil" aria-hidden="true"></span><span>Choisis une matière et lance-toi, {{PRENOM}} !</span></p>
    <p class="espace-parent" id="espace-parent" hidden>🔒 Espace parent · ton enfant utilise son propre lien, sans les pages parents</p>
    <input class="search" id="q" type="search" placeholder="Chercher un quiz…" aria-label="Chercher un quiz">
    <a class="ctrl-link" href="controles.html">🖨️ Mes contrôles papier</a>
    <div id="serie"></div>
    <div id="semaine"></div>
    <div class="filters" id="filters"></div>
  </header>
  <main id="list"></main>
  <p class="foot" id="foot"><a href="ajouter.html">➕ Ajouter un quiz</a> · <a href="tableau-de-bord.html">📊 Suivi des résultats (parents)</a></p>
 </div>
 <aside id="recompenses"></aside>
</div>

<script src="commun/catalogue.js"></script>
<script src="commun/badges.js"></script>
<script>
/* La liste des quiz est dans commun/catalogue.js */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
let filtre = "tout";

function afficherFiltres(){
  const presentes = [...new Set(QUIZ.map(q => q.matiere in MATIERES ? q.matiere : "autre"))];
  const el = document.getElementById("filters");
  if (presentes.length < 2) { el.innerHTML = ""; return; }
  el.innerHTML = ["tout", ...Object.keys(MATIERES).filter(m => presentes.includes(m))]
    .map(m => `<button data-m="${m}" class="${m === filtre ? "on" : ""}">${m === "tout" ? "Tout" : MATIERES[m].emo + " " + MATIERES[m].nom}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { filtre = b.dataset.m; afficherFiltres(); afficherListe(); });
}

function afficherListe(){
  const texte = document.getElementById("q").value.trim().toLowerCase();
  const list = document.getElementById("list");
  if (!QUIZ.length) {
    list.innerHTML = `<div class="empty">Aucun quiz pour l'instant… Les premiers arrivent bientôt ! 🚀</div>`;
    return;
  }
  const visibles = QUIZ.filter(q => {
    const m = q.matiere in MATIERES ? q.matiere : "autre";
    return (filtre === "tout" || filtre === m) &&
           (!texte || (q.titre + " " + (q.description || "")).toLowerCase().includes(texte));
  });
  if (!visibles.length) { list.innerHTML = `<div class="empty">Aucun quiz ne correspond à ta recherche.</div>`; return; }
  list.innerHTML = Object.keys(MATIERES).map(m => {
    const qs = visibles.filter(q => (q.matiere in MATIERES ? q.matiere : "autre") === m)
                       .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    if (!qs.length) return "";
    const M = MATIERES[m];
    return `<section><h2><span class="dot" style="background:${M.c}"></span>${M.emo} ${M.nom}</h2><div class="grid">` +
      qs.map(q => `<a class="card" style="--c:${M.c}" href="${encodeURI(q.fichier)}">
        <div class="emo">${M.emo}</div><div class="t">${esc(q.titre)}</div>
        <div class="d">${esc(q.description)}</div>${badge(q)}</a>`).join("") + `</div></section>`;
  }).join("");
}

/* ---------- scores (suivi des résultats) ---------- */
let STATS = {};
const cle = f => String(f).split("/").pop().replace(/\.html$/i, "");
function badge(q) {
  const s = STATS[cle(q.fichier)];
  if (!s) {
    const recent = q.date && (Date.now() - new Date(q.date)) < 7 * 864e5;
    return recent && /\.html$/i.test(q.fichier) ? `<span class="new">Nouveau !</span>` : "";
  }
  const etoiles = s.best >= 90 ? "⭐⭐⭐" : s.best >= 70 ? "⭐⭐" : s.best >= 50 ? "⭐" : "💪";
  return `<span class="score" title="Meilleur score">${etoiles} ${s.best} % · ${s.n} partie${s.n > 1 ? "s" : ""}</span>`;
}
function calculerStats(liste) {
  STATS = {};
  const jours = new Set();
  liste.forEach(r => {
    if (!r.total) return;
    const k = cle(r.quiz), p = Math.round(r.score / r.total * 100);
    const s = STATS[k] = STATS[k] || { best: 0, n: 0 };
    s.best = Math.max(s.best, p); s.n++;
    if (r.date) jours.add(new Date(r.date).toLocaleDateString("fr-CA"));
  });
  // série de jours d'affilée (aujourd'hui ou hier compris)
  let serie = 0; const d = new Date();
  if (!jours.has(d.toLocaleDateString("fr-CA"))) d.setDate(d.getDate() - 1);
  while (jours.has(d.toLocaleDateString("fr-CA"))) { serie++; d.setDate(d.getDate() - 1); }
  document.getElementById("serie").innerHTML = serie >= 2 ? `<span class="serie">🔥 ${serie} jours d'affilée, bravo !</span>` : "";
  afficherSemaine(liste);
}
/* ---------- « Ma semaine » : la semaine en cours (lundi → dimanche) comparée à la précédente ---------- */
function lundi(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function afficherSemaine(liste) {
  const el = document.getElementById("semaine");
  const parties = liste.filter(r => r.total && r.date && !isNaN(new Date(r.date)));
  if (!parties.length) { el.innerHTML = ""; return; }
  const debut = lundi(new Date()), SEM = 7 * 864e5;
  const num = d => Math.floor((lundi(d) - debut) / SEM + 0.5);     // 0 = cette semaine, -1 = la précédente…
  const sem = n => {
    const ps = parties.filter(r => num(new Date(r.date)) === n);
    const bonnes = ps.reduce((t, r) => t + r.score, 0), total = ps.reduce((t, r) => t + r.total, 0);
    return { quiz: ps.length, bonnes, moyenne: total ? Math.round(bonnes / total * 100) : null,
             jours: new Set(ps.map(r => (new Date(r.date).getDay() + 6) % 7)) };
  };
  const cette = sem(0), avant = sem(-1);
  const ecart = (a, b, unite = "") => {
    if (b === null || b === undefined || a === null) return "";
    const d = a - b;
    return d > 0 ? `<em class="plus">▲ +${d}${unite}</em>` : d < 0 ? `<em class="moins">▼ ${d}${unite}</em>` : `<em class="egal">= pareil</em>`;
  };
  const auj = (new Date().getDay() + 6) % 7;
  const jours = ["L", "M", "M", "J", "V", "S", "D"].map((l, i) =>
    `<div class="sem-jour${cette.jours.has(i) ? " fait" : ""}${i === auj ? " auj" : ""}">${l}<i>${cette.jours.has(i) ? "✓" : ""}</i></div>`).join("");
  const six = [-5, -4, -3, -2, -1, 0].map(n => ({ n, b: sem(n).bonnes }));
  const max = Math.max(1, ...six.map(x => x.b));
  const barres = six.map(x => `<div${x.n === 0 ? ' class="cette"' : ""} title="${x.b} bonne${x.b > 1 ? "s" : ""} réponse${x.b > 1 ? "s" : ""}" style="height:${Math.round(x.b / max * 44)}px"></div>`).join("");
  const noms = six.map(x => `<span>${x.n === 0 ? "cette sem." : x.n === -1 ? "sem. passée" : ""}</span>`).join("");
  const msg = !cette.quiz ? "Lance un quiz pour commencer ta semaine ! 🚀"
    : cette.bonnes > avant.bonnes ? "Tu as déjà fait mieux que la semaine dernière, bravo ! 🎉"
    : avant.bonnes ? `Encore ${avant.bonnes - cette.bonnes + 1} bonne${avant.bonnes - cette.bonnes + 1 > 1 ? "s" : ""} réponse${avant.bonnes - cette.bonnes + 1 > 1 ? "s" : ""} pour battre la semaine dernière ! 💪`
    : "Belle semaine, continue comme ça ! 🌟";
  el.innerHTML = `<section class="semaine" aria-label="Ma semaine">
    <h3>📅 Ma semaine <small>${cette.jours.size} jour${cette.jours.size > 1 ? "s" : ""} sur 7</small></h3>
    <div class="sem-jours">${jours}</div>
    <div class="sem-chiffres">
      <div class="sem-chiffre"><b>${cette.quiz}</b><span>quiz joué${cette.quiz > 1 ? "s" : ""}</span>${avant.quiz ? ecart(cette.quiz, avant.quiz) : ""}</div>
      <div class="sem-chiffre"><b>${cette.bonnes}</b><span>bonne${cette.bonnes > 1 ? "s" : ""} réponse${cette.bonnes > 1 ? "s" : ""}</span>${avant.quiz ? ecart(cette.bonnes, avant.bonnes) : ""}</div>
      <div class="sem-chiffre"><b>${cette.moyenne === null ? "–" : cette.moyenne + " %"}</b><span>de réussite</span>${ecart(cette.moyenne, avant.moyenne, " pts")}</div>
    </div>
    <div class="sem-barres" aria-hidden="true">${barres}</div><div class="sem-noms" aria-hidden="true">${noms}</div>
    <p class="sem-msg">${msg}</p></section>`;
}
async function chargerScores() {
  let liste = null;
  try {
    const r = await fetch("/api/resultats", { cache: "no-store", credentials: "same-origin" });
    if (r.ok) liste = (await r.json()).resultats;
  } catch (e) {}
  if (!liste) { try { liste = JSON.parse(localStorage.getItem("uqSuivi.local")) || []; } catch (e) { liste = []; } }
  calculerStats(liste);
  afficherListe();
}

document.getElementById("q").addEventListener("input", afficherListe);
afficherFiltres();
afficherListe();
chargerScores();
Badges.monter();
/* ---------- site de l'enfant / espace parent ---------- */
(function () {
  var U = window.__UQ || {}, f = document.getElementById("foot");
  var lien = (href, txt) => `<a href="${esc(href)}" target="_top">${txt}</a>`;
  if (U.espace === "enfant") {            // l'enfant ne voit pas les pages des parents, seulement la porte de l'espace parent
    f.innerHTML = U.urlParent ? lien(U.urlParent, "🔒 Espace parent") : "";
    return;
  }
  if (U.espace === "parent") document.getElementById("espace-parent").hidden = false;
  if (U.installateur) f.innerHTML += " · " + lien(U.installateur, "🔧 Installateur (mise à jour, lien pour l'enfant)");
})();

</script>
</body>
</html>
