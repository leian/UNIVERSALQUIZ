<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SoccaQuiz</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a9010d">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SoccaQuiz">
<style>
  html, body { margin: 0; height: 100%; background: #fff8ef; }
  #cadre { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff8ef; }
  #demarrage { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; text-align: center; background: #fff8ef; color: #2b2350;
    font: 600 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .25s; }
  #demarrage.fini { opacity: 0; pointer-events: none; }
  #demarrage img { width: 120px; height: 120px; border-radius: 26px; }
  #demarrage.attente img { animation: battre 1.4s ease-in-out infinite; }
  #demarrage #secours { font: 500 14px/1.4 system-ui, sans-serif; color: #6b5b4e; }
  #demarrage button { font: inherit; color: #fff; background: #a9010d; border: 0; border-radius: 999px; padding: 10px 22px; }
  @keyframes battre { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { #demarrage.attente img { animation: none; } }
</style>
</head>
<body>
<div id="demarrage" class="attente">
  <img src="icone-192.png" alt="">
  <span id="msg" role="status">Chargement…</span>
  <button id="reessayer" type="button" hidden>Réessayer</button>
  <a id="secours" href="#" hidden>Ouvrir sans l'appli</a>
</div>
<iframe id="cadre" title="SoccaQuiz" allow="microphone; autoplay; clipboard-write"></iframe>
<script>
/* =====================================================================
   APPLI INSTALLABLE SoccaQuiz — l'« enveloppe »
   Cette page ne contient aucune page de SoccaQuiz : elle affiche, en plein écran, le site de l'enfant
   (Google Apps Script) dont l'identifiant est dans l'adresse : …/app/?s=<identifiant du déploiement>.
   Elle n'apporte que l'icône, le plein écran et l'écran de démarrage. Aucun quiz ni résultat ne passe par elle.
   Filets de sécurité : interrupteur général (soccaquiz.json, "appli": "off") et retour automatique au site
   classique si le site ne s'affiche pas dans le cadre (site pas à jour, blocage du navigateur…).
   ===================================================================== */
(function () {
  var MOTIF = /^AKfy[\w-]{20,200}$/;
  var REGLAGES = 'https://leian.github.io/UNIVERSALQUIZ/soccaquiz.json';
  var DELAI = 15000;                       // sans nouvelle du site après ce délai : message et « Réessayer »
  var dem = document.getElementById('demarrage'), msg = document.getElementById('msg');
  var bouton = document.getElementById('reessayer'), cadre = document.getElementById('cadre'), secours = document.getElementById('secours');

  var id = null;
  try { id = new URLSearchParams(location.search).get('s'); } catch (e) {}
  try {
    if (id && MOTIF.test(id)) localStorage.setItem('sq-site', id);
    else id = localStorage.getItem('sq-site');           // secours si l'adresse a perdu son paramètre
  } catch (e) {}
  if (!id || !MOTIF.test(id)) {
    dem.classList.remove('attente');
    msg.textContent = 'Ouvre le lien SoccaQuiz reçu par mail.';
    return;
  }

  var BASE = 'https://script.google.com/macros/s/' + id + '/exec';
  var DIRECT = 'https://app.soccaquiz.fr';
  var minuterie = 0, parti = false;

  // on quitte l'enveloppe pour le site tel qu'il a toujours été (…&classique=1 : le site ne renvoie pas vers l'appli)
  function classique(url) {
    if (parti) return;
    parti = true;
    var u = new URL(url || BASE);
    u.searchParams.delete('cadre');
    u.searchParams.set('classique', '1');
    location.replace(u.href);
  }
  /* seulement une page de CE site : …/exec ou …/exec?… */
  function pageDuSite(url) {
    try {
      var u = new URL(url);
      return u.origin + u.pathname === BASE ? u : null;
    } catch (e) { return null; }
  }
  function attendre(url) {
    clearTimeout(minuterie);
    // jamais de renvoi automatique vers l'adresse Google (bandeau Google) : un message, « Réessayer »,
    // et en dernier recours un lien discret pour ouvrir le site hors de l'appli, au choix de la personne
    minuterie = setTimeout(function () {
      dem.classList.remove('attente', 'fini');
      msg.textContent = navigator.onLine === false ? 'Pas de connexion à Internet. Réessaie dans un instant.' : 'SoccaQuiz met du temps à répondre. Réessaie dans un instant.';
      bouton.hidden = false;
      secours.hidden = navigator.onLine === false;
      secours.onclick = function (e) { e.preventDefault(); classique(url); };
    }, DELAI);
  }
  function ouvrir(url) {
    var u = pageDuSite(url);
    if (!u) return;
    var simple = u.href;
    u.searchParams.set('cadre', '1');
    dem.classList.add('attente');
    dem.classList.remove('fini');
    msg.textContent = 'Chargement…';
    bouton.hidden = true;
    secours.hidden = true;
    attendre(simple);
    cadre.src = u.href;
  }

  window.addEventListener('message', function (e) {
    // appli servie hors de Google (app.soccaquiz.fr) : elle annonce qu'elle est affichée, ou que ce site n'a pas l'API
    if (e.origin === DIRECT && e.source === cadre.contentWindow && e.data && typeof e.data === 'object') {
      if (e.data.uq === 'pret') { clearTimeout(minuterie); dem.classList.add('fini'); }
      else if (e.data.uq === 'ancien') {
        try { localStorage.setItem('sq-ancien:' + id, String(Date.now())); } catch (err) {}   // revérifié le lendemain (site mis à jour entre-temps)
        modeActuel = 'cadre';
        ouvrir(q && q.length < 2000 ? BASE + '?' + q : BASE);
      }
      return;
    }
    var hote = '';
    try { hote = new URL(e.origin).hostname; } catch (err) { return; }
    // les pages Apps Script sont servies depuis *.googleusercontent.com
    if (hote !== 'script.google.com' && !/\.googleusercontent\.com$/.test(hote)) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.uq === 'pret') {                 // le site est affiché : on retire l'écran de démarrage
      clearTimeout(minuterie);
      dem.classList.add('fini');
      try { e.source.postMessage({ uq: 'cadre-ok' }, e.origin); } catch (err) {}
    } else if (d.uq === 'aller' && typeof d.url === 'string') {
      var u = pageDuSite(d.url);
      if (u) { u.searchParams.delete('cadre'); ouvrir(u.href); }
    }
  });
  bouton.addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { if (!bouton.hidden) location.reload(); });

  // page demandée (…&q=page=quiz_x) : ancien lien ou favori renvoyé ici par le site
  var q = '';
  try { q = new URLSearchParams(location.search).get('q') || ''; } catch (e) {}

  /* Appli servie hors de Google (app.soccaquiz.fr, Cloudflare Pages) ou site dans le cadre de Google ?
     - interrupteur général "appli" de soccaquiz.json : "direct" → app.soccaquiz.fr ; "on" (ou absent) → cadre de Google ;
       "off" → site classique. Il est retenu sur l'appareil et appliqué dès l'ouverture suivante (ou tout de suite
       s'il arrive dans les premières secondes) ;
     - …&mode=direct, &mode=cadre : choix forcé sur CET appareil (essais) ; &mode=auto : retour à l'interrupteur ;
     - un site sans l'API (avant la v2.88) est signalé par l'appli (« ancien ») et reste dans le cadre de Google. */
  var debut = Date.now(), modeForce = null, modeGeneral = null, ancien = false;
  try {
    var m = new URLSearchParams(location.search).get('mode');
    if (m === 'direct' || m === 'cadre') localStorage.setItem('sq-mode', m);
    if (m === 'auto') localStorage.removeItem('sq-mode');
    modeForce = localStorage.getItem('sq-mode');
    modeGeneral = localStorage.getItem('sq-mode-general');
    ancien = Date.now() - (+localStorage.getItem('sq-ancien:' + id) || 0) < 864e5;
  } catch (e) {}
  function modeVoulu() { return !ancien && (modeForce ? modeForce === 'direct' : modeGeneral === 'direct') ? 'direct' : 'cadre'; }
  function ouvrirDirect() {
    var p = new URLSearchParams(q.length < 2000 ? q : ''), page = p.get('page') || '';
    var u = DIRECT + '/?s=' + encodeURIComponent(id) + (p.get('chrono') ? '&chrono=' + encodeURIComponent(p.get('chrono')) : '') +
      (page && page !== 'index' ? '#' + encodeURIComponent(page) : '');
    dem.classList.add('attente');
    dem.classList.remove('fini');
    msg.textContent = 'Chargement…';
    bouton.hidden = true;
    secours.hidden = true;
    attendre(q && q.length < 2000 ? BASE + '?' + q : BASE);
    cadre.src = u;
  }
  var modeActuel = modeVoulu();
  if (modeActuel === 'direct') ouvrirDirect(); else ouvrir(q && q.length < 2000 ? BASE + '?' + q : BASE);
  // interrupteur général : "appli": "off" → tout le monde revient au site classique, icônes déjà installées comprises
  fetch(REGLAGES, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (c) {
      if (c && c.appli === 'off') return classique();
      modeGeneral = c && c.appli === 'direct' ? 'direct' : 'cadre';
      try { localStorage.setItem('sq-mode-general', modeGeneral); } catch (e) {}
      // l'interrupteur a changé : appliqué tout de suite si l'appli vient de s'ouvrir, sinon à la prochaine ouverture
      if (modeVoulu() !== modeActuel && Date.now() - debut < 5000) {
        modeActuel = modeVoulu();
        if (modeActuel === 'direct') ouvrirDirect(); else ouvrir(q && q.length < 2000 ? BASE + '?' + q : BASE);
      }
    })
    .catch(function () {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
