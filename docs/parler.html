<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SoccaQuiz — Parler</title>
<link rel="icon" href="icone-96.png">
<link rel="stylesheet" href="polices/polices.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#fff8ef;color:#3a2a20;font:18px/1.5 Nunito,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  main{max-width:520px;width:100%;background:#fff;border:2px solid #f0e2d0;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 8px 30px rgba(120,60,20,.08)}
  .marque{display:flex;align-items:center;justify-content:center;gap:10px;font:700 1.1rem Fredoka,system-ui,sans-serif;color:#C8102E}
  .marque img{width:36px;height:36px;border-radius:9px}
  .consigne{margin:18px 0 6px;color:#6b5546}
  .phrase{font:600 1.6rem/1.3 Fredoka,system-ui,sans-serif;color:#8f0b20;margin:4px 0 22px;word-wrap:break-word}
  button{font:700 1.15rem Fredoka,system-ui,sans-serif;border-radius:999px;padding:14px 26px;cursor:pointer;border:2px solid #C8102E;margin:6px}
  .principal{background:#C8102E;color:#fff;font-size:1.35rem;padding:18px 34px}
  .principal.actif{background:#8f0b20;animation:pulse 1.2s infinite}
  .second{background:#fff4f2;color:#C8102E}
  button{transition:scale .12s,filter .12s;-webkit-tap-highlight-color:transparent}
  button:active{scale:.95;filter:brightness(.92);transition-duration:.04s}
  button:focus-visible{outline:3px solid #d9a520;outline-offset:3px}
  @keyframes pulse{50%{box-shadow:0 0 0 12px rgba(200,16,46,.15)}}
  .entendu{margin-top:18px;font-size:1.15rem}
  .note{margin-top:16px;color:#6b5546;font-size:.95rem}
  .ok{color:#15803d;font-weight:700}
  .ko{color:#b45309;font-weight:700}
  @media (prefers-color-scheme:dark){body{background:#1f1611;color:#f3e6da}main{background:#2a1e17;border-color:#4a3527}.phrase{color:#ff8a8a}.consigne,.note{color:#cdb6a4}.second{background:#3a2a20}}
</style>
</head>
<body>
<main>
  <div class="marque"><img src="icone-96.png" alt=""> SoccaQuiz</div>
  <div class="consigne" id="consigne">Écoute, puis touche « Parler » et répète :</div>
  <div class="phrase" id="phrase"></div>
  <div>
    <button class="second" id="ecouter" type="button">🔊 Écouter</button>
    <button class="second" id="lent" type="button">🐢 Lentement</button>
  </div>
  <div><button class="principal" id="parler" type="button">🎤 Parler</button></div>
  <div class="entendu" id="entendu" aria-live="polite"></div>
  <div class="note" id="note" aria-live="polite"></div>
</main>
<script>
(function () {
  // Page d'écoute de SoccaQuiz : ouverte par un quiz (hors du cadre de Google Apps Script, qui bloque le micro).
  // Elle reçoit la phrase dans l'ancre (#…), écoute l'enfant, puis renvoie ce qu'elle a entendu au quiz et se ferme.
  // Rien n'est envoyé ailleurs qu'à l'onglet du quiz ; rien n'est gardé.
  var d = {};
  try { d = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) {}
  var phrase = String(d.p || '').slice(0, 300), langue = /^[a-z]{2}(-[A-Za-z]{2})?$/.test(d.l || '') ? d.l : 'en-GB', id = String(d.id || '').slice(0, 20);
  var $ = function (i) { return document.getElementById(i); };
  var libre = phrase === '*';
  $('phrase').textContent = libre ? '' : phrase;
  if (libre) $('consigne').textContent = 'Touche « Parler » et réponds à voix haute :';
  if (libre || !phrase) { $('ecouter').style.display = 'none'; $('lent').style.display = 'none'; }
  if (!phrase) { $('consigne').textContent = 'Cette page s\'ouvre depuis un quiz SoccaQuiz, avec le bouton « Parler ».'; $('parler').style.display = 'none'; return; }

  function voixDe(l) {
    var v = speechSynthesis.getVoices(), base = l.slice(0, 2);
    return v.filter(function (x) { return x.lang.replace('_', '-') === l; })[0] || v.filter(function (x) { return x.lang.slice(0, 2) === base; })[0] || null;
  }
  function dire(lent) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(phrase); u.lang = langue; u.rate = lent ? 0.6 : 0.9;
    var v = voixDe(langue); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  $('ecouter').onclick = function () { dire(false); };
  $('lent').onclick = function () { dire(true); };

  function mots(s) { return String(s).toLowerCase().replace(/[’‘]/g, "'").normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean); }
  function ressemblance(a, b) { a = mots(a); b = mots(b); if (!a.length) return b.length ? 1 : 0; var j = 0, ok = 0; a.forEach(function (m) { var k = b.indexOf(m, j); if (k >= 0) { ok++; j = k + 1; } }); return ok / a.length; }

  var R = window.SpeechRecognition || window.webkitSpeechRecognition, reco = null, ecoute = false;
  if (!R) { $('parler').style.display = 'none'; $('note').textContent = 'Ce navigateur ne sait pas écouter. Ouvre le quiz dans Chrome, ou utilise les boutons « Je l\'ai bien dit » / « À retravailler » du quiz.'; return; }

  function renvoyer(alts) {
    var ouvreur = null; try { ouvreur = window.opener; } catch (e) {}
    if (ouvreur && id) {
      try { ouvreur.postMessage({ uq: 'parler', id: id, alts: alts }, '*'); } catch (e) { ouvreur = null; }
    }
    return !!ouvreur;
  }
  function etat(on) { ecoute = on; $('parler').classList.toggle('actif', on); $('parler').textContent = on ? '🎙️ Je t\'écoute…' : '🎤 Parler'; }

  function lancer() {
    if (ecoute) { try { reco.stop(); } catch (e) {} return; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    reco = new R(); reco.lang = langue; reco.interimResults = false; reco.maxAlternatives = 3;
    reco.onresult = function (e) {
      var alts = []; for (var i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
      var meilleur = alts.reduce(function (b, t) { return ressemblance(phrase, t) > ressemblance(phrase, b) ? t : b; }, alts[0] || '');
      var reussi = libre ? !!meilleur.trim() : ressemblance(phrase, meilleur) >= 0.75;
      etat(false);
      $('entendu').innerHTML = '';
      var p = document.createElement('div'); p.textContent = 'J\'ai entendu : « ' + meilleur + ' »'; $('entendu').appendChild(p);
      var v = document.createElement('div'); v.className = reussi ? 'ok' : 'ko'; v.textContent = reussi ? 'Bien dit !' : 'Presque ! Réécoute le modèle, puis réessaie.'; $('entendu').appendChild(v);
      if (!reussi) { $('note').textContent = ''; return; }
      if (renvoyer(alts)) {
        $('note').textContent = 'Retour au quiz…';
        setTimeout(function () { window.close(); $('note').textContent = 'Tu peux fermer cette page et revenir au quiz.'; }, 900);
      } else {
        $('note').textContent = 'Reviens sur l\'onglet du quiz et touche « Je l\'ai bien dit ».';
      }
    };
    reco.onerror = function (e) {
      etat(false);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        $('note').textContent = /Android/i.test(navigator.userAgent)
          ? 'Le micro est bloqué. Dans Chrome : ⋮ → Commandes du site → Autorisations → Micro → Autoriser. Vérifie aussi Réglages du téléphone → Applications → Chrome → Autorisations → Micro.'
          : 'Le micro est bloqué. Touche l\'icône à gauche de l\'adresse → Micro → Autoriser, puis réessaie.';
      } else if (e.error === 'network') $('note').textContent = 'L\'écoute a besoin d\'internet. Vérifie la connexion, puis réessaie.';
      else $('note').textContent = 'Je n\'ai rien entendu. Touche « Parler » et réessaie.';
    };
    reco.onend = function () { if (ecoute) etat(false); };
    $('note').textContent = '';
    etat(true);
    try { reco.start(); } catch (e) { etat(false); }
  }
  $('parler').onclick = lancer;
  setTimeout(lancer, 300);   // la page vient d'être ouverte par un toucher : on écoute tout de suite (Chrome demande le micro la 1re fois)
})();
</script>
</body>
</html>
